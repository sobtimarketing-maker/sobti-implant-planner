name: Test and build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Check the APK asks for no internet permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          if $AAPT dump permissions android/app/build/outputs/apk/debug/app-debug.apk | grep -q INTERNET; then
            echo "INTERNET permission found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: implant-planner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
